name: Windows launcher checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-launch:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and verify project
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript or Vite build failed' }
          npm install --prefix server --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Server driver dependencies failed to install' }
          npm --prefix server run check:types
          if ($LASTEXITCODE -ne 0) { throw 'Four-database TypeScript check failed' }
      - name: Parse Windows PowerShell scripts without running them
        shell: pwsh
        run: |
          foreach ($file in @('scripts/start.ps1', 'scripts/apply-update.ps1', 'scripts/launcher-helpers.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($problem in $errors) {
                Write-Host ("PARSE ERROR " + $file + " at line " + $problem.Extent.StartLineNumber + ": " + $problem.Message + " [near: " + $problem.Extent.Text + "]")
              }
              throw ('PowerShell parse errors in ' + $file)
            }
          }
      - name: Verify PowerShell updater safety checks
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/apply-update.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Updater PowerShell self-test failed' }
      - name: Verify exact GitHub archive and Git tree without installation
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/apply-update.ps1 -Commit 152065f3c70cfdb523e8accb812ce3334942671c -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'GitHub archive verification failed' }
      - name: Verify NoSQL BAT command handling (without Docker)
        shell: pwsh
        run: |
          & $env:ComSpec /D /C "Hayumeri-DB.bat help"
          if ($LASTEXITCODE -ne 0) { throw 'NoSQL BAT failed before invoking Docker' }
      - name: Double-click style BAT smoke test (Unicode, spaces, exclamation, ampersand)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'Hayumeri кириллица ! & test'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          foreach ($name in @('Hayumeri.bat', 'package.json', 'package-lock.json', 'index.html', 'tsconfig.json', 'vite.config.ts')) {
            Copy-Item -LiteralPath $name -Destination $folder -ErrorAction Stop
          }
          foreach ($name in @('scripts', 'src', 'config')) {
            Copy-Item -LiteralPath $name -Destination $folder -Recurse -ErrorAction Stop
          }
          # Reproduce a real double-click where CI is not true. The Vite CLI
          # previously shut down on stdin EOF; CI=true masked the defect.
          $env:CI = 'false'
          $settingsPath = Join-Path $folder 'config/launcher.json'
          $settings = Get-Content -LiteralPath $settingsPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $settings.openBrowser = $false
          $settings | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $settingsPath -Encoding UTF8
          $stdout = Join-Path $env:RUNNER_TEMP 'hayumeri-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'hayumeri-stderr.log'
          # Hold the default port to verify automatic fallback and the reported URL.
          $portBlocker = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 5173)
          $portBlocker.Start()
          $main = Start-Process -FilePath $env:ComSpec -ArgumentList @('/D', '/C', 'Hayumeri.bat') -WorkingDirectory $folder -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              $main.Refresh()
              $launcherLog = Join-Path $folder 'logs/launch.log'
              if (Test-Path -LiteralPath $launcherLog) {
                $logText = Get-Content -LiteralPath $launcherLog -Raw
                if ($logText -match 'ERROR:|\[ОШИБКА\]') { throw 'BAT reported a startup error. See launcher log below.' }
              }
              if ($main.HasExited) { throw "BAT exited early with code $($main.ExitCode)" }
              try {
                $statusFile = Join-Path $folder '.runtime/launcher-status.json'
                if (Test-Path -LiteralPath $statusFile) {
                  $status = Get-Content -LiteralPath $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                  if ($status.state -eq 'РАБОТАЕТ') {
                    if ($status.address -eq 'http://127.0.0.1:5173/') { throw 'Occupied port 5173 was reused' }
                    $response = Invoke-WebRequest -Uri $status.address -UseBasicParsing -TimeoutSec 2
                    if ($response.StatusCode -eq 200 -and $response.Content -match 'Hayumeri') {
                      $ready = $true
                      break
                    }
                  }
                }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'Local web server did not become healthy in 120 seconds' }
            # Healthy for a moment is not enough: verify Vite survives a
            # closed/noninteractive stdin when the parent's CI is false.
            Start-Sleep -Seconds 8
            $main.Refresh()
            if ($main.HasExited) { throw "Vite exited after readiness (user-mode CI=false). BAT code: $($main.ExitCode)" }
            $alive = Invoke-WebRequest -Uri $status.address -UseBasicParsing -TimeoutSec 3
            if ($alive.StatusCode -ne 200) { throw 'Vite stopped serving after initially becoming ready' }
            Write-Host 'User-mode (CI=false) Vite remained running after readiness.'
            $url = $status.address
            $updateInfo = Invoke-RestMethod -Uri ($url + 'api/update/status') -TimeoutSec 5
            if ($updateInfo.repository -ne 'Aspksa/Hayumeri' -or $updateInfo.version -ne '0.2.0' -or -not $updateInfo.canApply) {
              throw 'Update status API is not working in BAT mode'
            }
            try {
              Invoke-RestMethod -Uri ($url + 'api/update/apply') -Method Post -ContentType 'application/json' -Headers @{ 'X-Hayumeri-Action' = '1' } -Body '{"sha":"0000000000000000000000000000000000000000"}' -TimeoutSec 5
              throw 'Cross-origin update without Origin header was accepted'
            } catch {
              if ($_.Exception.Message -eq 'Cross-origin update without Origin header was accepted') { throw }
            }
            $metrics = Get-Content -LiteralPath (Join-Path $folder '.runtime/launch-metrics.json') -Raw | ConvertFrom-Json
            if ($metrics.result -ne 'ready' -or $metrics.milliseconds.total -lt 0) { throw 'Invalid launch metrics' }
            $portBlocker.Stop()

            $second = Start-Process -FilePath $env:ComSpec -ArgumentList @('/D', '/C', 'Hayumeri.bat') -WorkingDirectory $folder -PassThru
            if (-not $second.WaitForExit(15000)) {
              & taskkill.exe /PID $second.Id /T /F | Out-Null
              throw 'Duplicate launch did not exit promptly'
            }
            if ($second.ExitCode -ne 0) { throw "Duplicate launch failed: $($second.ExitCode)" }
            $launcherLog = Join-Path $folder 'logs/launch.log'
            $content = Get-Content -LiteralPath $launcherLog -Raw
            if ($content -notmatch 'already starting or running') { throw 'Missing duplicate-instance protection log' }
            Write-Host 'BAT smoke test succeeded.'
          } finally {
            $portBlocker.Stop()
            & taskkill.exe /PID $main.Id /T /F 2>$null | Out-Null
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout | Select-Object -Last 50 }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr | Select-Object -Last 50 }
            $launcherLog = Join-Path $folder 'logs/launch.log'
            if (Test-Path -LiteralPath $launcherLog) { Get-Content -LiteralPath $launcherLog | Select-Object -Last 50 }
          }
      - name: Apply actual GitHub update in isolated Windows folder
        shell: pwsh
        env:
          TARGET_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'Hayumeri Upgrade кириллица ! & test'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          foreach ($name in @('Hayumeri.bat','package.json','index.html','tsconfig.json','vite.config.ts')) {
            Copy-Item -LiteralPath $name -Destination $folder -ErrorAction Stop
          }
          foreach ($name in @('config','scripts','src')) {
            Copy-Item -LiteralPath $name -Destination $folder -Recurse -ErrorAction Stop
          }
          try {
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $folder 'scripts/apply-update.ps1') -Commit $env:TARGET_COMMIT
            if ($LASTEXITCODE -ne 0) { throw 'Updater failed to apply actual GitHub commit' }
            $stateFile = Join-Path $folder '.runtime/update-state.json'
            if (-not (Test-Path -LiteralPath $stateFile)) { throw 'Missing installed commit marker' }
            $state = Get-Content -LiteralPath $stateFile -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($state.commit -ne $env:TARGET_COMMIT) { throw 'Installed commit was not saved' }
            $result = Get-Content -LiteralPath (Join-Path $folder '.runtime/update-progress.json') -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($result.state -ne 'ГОТОВО') { throw 'Update did not confirm health of new application' }
            $backups = @(Get-ChildItem -LiteralPath (Join-Path $folder '.runtime/updates') -Directory -Filter 'backup-*')
            if ($backups.Count -lt 1) { throw 'Updater did not create backup' }
            Write-Host 'Real GitHub update and automatic restart succeeded.'
          } finally {
            $log = Join-Path $folder '.runtime/update.log'
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 50 }
            $status = Join-Path $folder '.runtime/launcher-status.json'
            if (Test-Path -LiteralPath $status) {
              $data = Get-Content -LiteralPath $status -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($data.processId -gt 0) {
                & taskkill.exe /PID $data.processId /T /F 2>$null | Out-Null
              }
            }
          }
      - name: Detect corrupted source and invalid launcher settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'Hayumeri negative tests'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          foreach ($name in @('Hayumeri.bat', 'package.json', 'index.html', 'tsconfig.json', 'vite.config.ts')) {
            Copy-Item -LiteralPath $name -Destination $folder
          }
          foreach ($name in @('config', 'scripts', 'src')) {
            Copy-Item -LiteralPath $name -Destination $folder -Recurse
          }
          $launcher = Join-Path $folder 'scripts/start.ps1'
          Add-Content -LiteralPath (Join-Path $folder 'src/main.ts') -Value 'corrupted'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $launcher
          if ($LASTEXITCODE -eq 0) { throw 'Corrupted source was accepted' }
          $status = Get-Content -LiteralPath (Join-Path $folder '.runtime/launcher-status.json') -Raw | ConvertFrom-Json
          if ($status.state -ne 'ОШИБКА' -or $status.message -notmatch 'Контрольная сумма') {
            throw 'Missing checksum diagnostic'
          }
          Copy-Item -LiteralPath 'src/main.ts' -Destination (Join-Path $folder 'src/main.ts') -Force
          '{"preferredPort":"broken"}' | Set-Content -LiteralPath (Join-Path $folder 'config/launcher.json') -Encoding UTF8
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $launcher
          if ($LASTEXITCODE -eq 0) { throw 'Invalid config was accepted' }
          $status = Get-Content -LiteralPath (Join-Path $folder '.runtime/launcher-status.json') -Raw | ConvertFrom-Json
          if ($status.state -ne 'ОШИБКА' -or $status.message -notmatch 'конфигурации|поле|настройка') {
            throw 'Missing config diagnostic'
          }
          Write-Host 'Negative preflight tests succeeded.'
          exit 0 # Expected error codes above were verified; the test itself succeeded.
