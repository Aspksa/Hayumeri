# Hayumeri NoSQL stack. Docker Desktop: Linux containers / Compose v2.
# localhost-only ports; no container starts with Windows unless explicitly launched.
name: hayumeri-nosql
services:
  mongodb:
    image: mongo:8.0.30
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hayumeri
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run Hayumeri-DB.bat start to generate credentials}
      MONGO_INITDB_DATABASE: hayumeri
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username hayumeri --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    mem_limit: 1g

  redis:
    image: redis:8.2-alpine
    restart: "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run Hayumeri-DB.bat start to generate credentials}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  neo4j:
    image: neo4j:2026.10.1
    restart: "no"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run Hayumeri-DB.bat start to generate credentials}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: 1600m

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: "no"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run Hayumeri-DB.bat start to generate credentials}
      QDRANT__SERVICE__HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g

volumes:
  mongodb_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
